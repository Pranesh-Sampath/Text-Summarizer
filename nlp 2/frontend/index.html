<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NLP Text Summarizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>📝 Medical Note Classifier</h1>
    <p class="subtitle">Analyze clinical notes </p>

    <div class="card">
      <label for="inputText">Enter Article Note</label>
      <textarea id="inputText" rows="8" placeholder="Paste your article here..."></textarea>

      <div class="options">
        <label for="method">Method:</label>
        <select id="method">
          <option value="extractive">Extractive (TF-IDF + spaCy)</option>
          <option value="abstractive">Abstractive (BART)</option>
        </select>

        <label for="numSentences">Sentences (Extractive only):</label>
        <input type="number" id="numSentences" value="3" min="1" max="10" />
      </div>

      <button id="analyzeBtn" onclick="analyzeNote()">Analyze</button>
    </div>

    <div class="card" id="resultCard" style="display:none;">
      <h2>📄 Summary</h2>
      <p id="methodBadge" class="badge"></p>
      <p id="summaryOutput"></p>

      <button onclick="copyToClipboard()">📋 Copy</button>
      <button onclick="saveSummary()">💾 Save</button>
    </div>

    <div class="card" id="entitiesCard" style="display:none;">
      <h2>🧬 Note Analysis</h2>
      <p><strong>Note Type:</strong> <span id="noteTypeOutput"></span></p>
      <p><strong>Symptoms:</strong> <span id="symptomsOutput"></span></p>
      <p><strong>Medications:</strong> <span id="medicationsOutput"></span></p>
      <pre id="analysisOutput" class="output"></pre>
    </div>

    <div id="loader" style="display:none;" class="loader">Summarizing...</div>
    <div id="errorMsg" class="error"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
